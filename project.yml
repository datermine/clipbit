name: Clipbit
options:
  bundleIdPrefix: com.georgemike
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Clipbit:
    type: application
    platform: macOS
    sources:
      - path: Clipbit
      - path: Supporting
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgemike.ClipBit
        PRODUCT_NAME: ClipBit
        PRODUCT_MODULE_NAME: Clipbit
        INFOPLIST_FILE: Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Supporting/Clipbit.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 39M246A2UR
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  ClipbitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipbitTests
    dependencies:
      - target: Clipbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgemike.ClipBitTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 39M246A2UR
        # The product is ClipBit.app while the target stays Clipbit; xcodegen derives the
        # host path from the target name, so spell it out.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClipBit.app/Contents/MacOS/ClipBit
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Clipbit:
    build:
      targets:
        Clipbit: all
        ClipbitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClipbitTests
    archive:
      config: Release
